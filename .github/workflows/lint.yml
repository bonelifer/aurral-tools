name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported and current Python
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install flake8
        run: python -m pip install flake8
      - name: Compile
        run: python -m py_compile *.py
      - name: flake8
        run: python -m flake8 *.py
      - name: Every tool prints help without arguments
        # No arguments prints help and exits 2
        run: |
          set +e
          for tool in get-deezer-arl.py cancel-stuck-downloads.py approve-reviews.py rescan-library.py unmonitor.py strip-musicbrainz-tags.py; do
            python "$tool" 2> help.txt
            status=$?
            if [ "$status" -ne 2 ] || ! grep -q "usage:" help.txt; then
              echo "$tool: expected help and exit 2, got $status"
              exit 1
            fi
          done

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck start-queue-helpers.sh
